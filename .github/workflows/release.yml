name: Build and publish game releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build app image
        shell: bash
        run: ./gradlew jpackageImage "-PreleaseVersion=${GITHUB_REF_NAME#v}"

      - name: Zip Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/jpackage/JavaChess -DestinationPath JavaChess-windows.zip

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/jpackage/JavaChess.app JavaChess-macos.zip

      - name: Zip Linux app
        if: runner.os == 'Linux'
        run: (cd build/jpackage && zip -qr "$GITHUB_WORKSPACE/JavaChess-linux.zip" JavaChess)

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: JavaChess-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Create release and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
